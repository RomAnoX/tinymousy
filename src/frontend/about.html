<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>About tinymousy</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 6px; font: 13px -apple-system, system-ui, sans-serif;
         text-align: center; user-select: none; }
  img { width: 96px; height: 96px; }
  h1 { margin: 8px 0 0; font-size: 18px; }
  p { margin: 0; opacity: .7; }
</style>
</head>
<body>
<img src="about-icon.png" alt="">
<h1>tinymousy</h1>
<p id="ver">Version</p>
<p>Keeps your Mac awake and apps like Teams active<br>by nudging the mouse from the menu bar.</p>
<script>
  const t = setInterval(async () => {
    if (!window.tiny) return;
    clearInterval(t);
    const { version } = await tiny.app.info();
    document.getElementById('ver').textContent = 'Version ' + version;
  }, 50);
</script>
</body>
</html>
